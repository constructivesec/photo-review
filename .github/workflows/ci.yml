# Lint, test (real bundled ExifTool) and build the app on Windows and macOS (spec 16).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fetch pinned ExifTool (checksum verified)
        run: python tools/fetch_exiftool.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Metadata spike
        run: python spike/spike.py
      - name: Build
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm --clean photo_review.spec
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoReview-windows
          path: dist/PhotoReview.exe
      - name: Upload macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PhotoReview.app PhotoReview-macos.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoReview-macos
          path: PhotoReview-macos.zip
